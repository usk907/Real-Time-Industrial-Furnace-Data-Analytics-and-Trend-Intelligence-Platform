[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "venv",
    "*/venv",
    "client",
    "dist",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module import order (needed for dotenv / sys.path bootstrapping)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["generator/tests", "server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live_db: Tests that verify connectivity against live MySQL database on port 3307",
]
